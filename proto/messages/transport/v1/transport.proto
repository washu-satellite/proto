syntax = "proto3";
package messages.transport.v1;

import "airis/telemetry/v1/telemetry.proto";

/*
 * This file defines internal transport protocols for communications between
 * the central control server and client peripherals (SDRs, web clients)
 */

// Server response to node creation to establish PUB/SUB link with client
message EstablishClient {
  string msg = 1;
}

message Message {
  string heading = 1;
  string message = 2;
}

// Command direction of Airis motors
message PointingCommand {
    float target_azimuth = 1;
    float target_elevation = 2;
}

// Command AIRIS to exit safe mode
message SafeModeExitCommand {
    bool force = 1; // if true, bypasses health checks (use with caution)
}

// Directive from ADAPT to change the comms downlink mode
message CommsDirective {
    enum Mode {
        MODE_FULL_UNSPECIFIED = 0; // normal operation — all downlink enabled
        MODE_SLOW = 1; // suspend image/large file transfers only
        MODE_STOP = 2; // suspend all ground downlink
    }
    Mode mode = 1;
}

// Wrapper for all packet types transferred across WashU Satellite projects
message MessageEnvelope {
  // routing information
  string sender_id = 1;
  string dest_id = 2;

  // define all possible message bodies
  oneof message_body {
    airis.telemetry.v1.Beacon airis_beacon = 10;
    EstablishClient internal_establish_client = 11;
    Message internal_message = 12;
    airis.telemetry.v1.GCNAlert gcn_alert = 13;
    airis.telemetry.v1.LocalizationUpdate localization_update = 14;
    PointingCommand pointing_cmd = 15;
    SafeModeExitCommand safe_mode_exit_cmd = 16;
    airis.telemetry.v1.NavigationUpdate navigation_update = 17;
    airis.telemetry.v1.EventNotification event_notification = 18;
    airis.telemetry.v1.ImageData image_data = 19;
    CommsDirective comms_directive = 20;
  }
}
